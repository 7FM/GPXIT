name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Install Android SDK packages
        # Keep in sync with compileSdk / buildToolsVersion in app/build.gradle.kts
        # and with androidSdk in flake.nix. From API 37 on Google only ships
        # minor-versioned platforms, hence "android-37.0" rather than "android-37".
        run: |
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run unit tests
        run: ./gradlew testFossDebugUnitTest

      - name: Build Release APK
        run: ./gradlew assembleFossRelease assembleFullRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/*/release/*.apk
