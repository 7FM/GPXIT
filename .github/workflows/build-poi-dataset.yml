name: Build POI Dataset

# Rebuilds the filtered SQLite POI datasets — one per Geofabrik extract
# listed in scripts/poi_datasets.json — and publishes them as assets of the
# `poi-data` release, together with pois-index.json, which the app reads to
# offer the datasets and check for updates. Users download only the
# countries they pick.
#
# Each extract builds in its own job, so one runner never holds more than a
# single extract (France, the largest, is about 5 GB). A failed job leaves
# that dataset's previously published file and index entry in place.
#
# Trigger on the 1st of each month, or on demand via workflow_dispatch.

on:
  schedule:
    # 03:17 UTC on the 1st of each month — slightly off-the-hour so we
    # don't pile onto the cron spike.
    - cron: '17 3 1 * *'
  workflow_dispatch:
    inputs:
      datasets:
        description: "Dataset ids to rebuild, comma-separated (see scripts/poi_datasets.json); empty = all"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: poi-dataset
  cancel-in-progress: false

jobs:
  datasets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: List datasets
        id: list
        env:
          ONLY: ${{ github.event.inputs.datasets }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          datasets = json.load(open("scripts/poi_datasets.json"))["datasets"]
          only = {s.strip() for s in os.environ.get("ONLY", "").split(",") if s.strip()}
          unknown = only - {d["id"] for d in datasets}
          if unknown:
              raise SystemExit(f"unknown datasets: {', '.join(sorted(unknown))}")
          include = [
              {"id": d["id"], "geofabrik": d["geofabrik"]}
              for d in datasets if not only or d["id"] in only
          ]
          print("matrix=" + json.dumps({"include": include}))
          EOF

  build:
    needs: datasets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Be gentle with download.geofabrik.de.
      max-parallel: 4
      matrix: ${{ fromJSON(needs.datasets.outputs.matrix) }}
    name: build (${{ matrix.id }})
    env:
      ID: ${{ matrix.id }}
      SOURCE: https://download.geofabrik.de/${{ matrix.geofabrik }}
    steps:
      - uses: actions/checkout@v7

      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
          osmium --version

      - name: Install Python dependencies
        # shapely assigns POIs to holiday regions and simplifies the
        # extract outline, holidays computes the public / school holidays
        # of those regions.
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r scripts/requirements.txt
          .venv/bin/pip list | grep -Ei '^(holidays|shapely) '

      - name: Download OSM extract
        run: |
          curl -fL --retry 3 --retry-delay 5 -o input.osm.pbf "$SOURCE-latest.osm.pbf"
          curl -fL --retry 3 --retry-delay 5 -o extract.poly "$SOURCE.poly"
          ls -lh input.osm.pbf extract.poly

      - name: Filter POI tags
        # Default behavior already includes nodes referenced by matched
        # ways (which `osmium export` needs to resolve way geometries).
        # -R/--omit-referenced would STRIP those nodes — the opposite of
        # what we want — so we deliberately don't pass it.
        run: |
          osmium tags-filter -O -o filtered.osm.pbf input.osm.pbf \
            'n/shop=supermarket,convenience,grocery,general,kiosk,deli,greengrocer,food,farm,butcher,organic,health_food,frozen_food,bakery,pastry,bicycle' \
            'w/shop=supermarket,convenience,grocery,general,kiosk,deli,greengrocer,food,farm,butcher,organic,health_food,frozen_food,bakery,pastry,bicycle' \
            'n/amenity=drinking_water,water_point,toilets,bicycle_repair_station' \
            'w/amenity=toilets,bicycle_repair_station' \
            'n/drinking_water=yes' \
            'n/man_made=water_tap'
          ls -lh filtered.osm.pbf

      - name: Export to GeoJSONSeq
        # -u type_id writes the OSM object id (n123 / w123 / a246) into each
        # feature; the builder needs it to drop the second copy osmium
        # exports of every closed way (once as a line, once as an area).
        run: |
          osmium export -O -u type_id -f geojsonseq -o filtered.geojsonseq filtered.osm.pbf
          ls -lh filtered.geojsonseq

      - name: Extract holiday regions
        # Administrative boundaries tagged with an ISO 3166 code (states,
        # countries). The app needs to know which region a POI is in to
        # evaluate public / school holiday rules in its opening hours.
        # Relations cut off at the extract border can't be assembled into
        # polygons; osmium skips them, and POIs there get no region.
        run: |
          osmium tags-filter -O -o boundaries.osm.pbf input.osm.pbf \
            'r/ISO3166-2' 'r/ISO3166-1' 'r/ISO3166-1:alpha2'
          osmium export -O -f geojsonseq --geometry-types=polygon \
            -o boundaries.geojsonseq boundaries.osm.pbf
          ls -lh boundaries.geojsonseq

      - name: Build SQLite DB
        run: |
          mkdir -p dist
          .venv/bin/python scripts/build_poi_db.py filtered.geojsonseq "dist/$ID.db" \
            --regions boundaries.geojsonseq --dataset "$ID"
          gzip -9 -k "dist/$ID.db"
          .venv/bin/python scripts/poi_index.py entry --dataset "$ID" \
            --db "dist/$ID.db" --gz "dist/$ID.db.gz" --poly extract.poly \
            -o "dist/$ID.json"
          rm "dist/$ID.db"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: poi-${{ matrix.id }}
          path: dist/
          retention-days: 3

  publish:
    needs: [datasets, build]
    # Publish whatever was built, even if some extracts failed.
    if: ${{ !cancelled() && needs.datasets.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: poi-*
          merge-multiple: true
          path: dist

      - name: Publish to the poi-data release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries=(dist/*.json)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "::error::No dataset was built."
            exit 1
          fi

          DATE_STR="$(date -u +'%Y-%m-%d')"
          NOTES="Filtered OSM POI datasets (grocery / bakery / drinking water / toilets / bike repair), one per country, with opening hours and the public / school holidays needed to evaluate them. pois-index.json lists them. Rebuilt monthly. pois.db.gz is the Germany dataset under its old name, for app versions before per-country downloads."
          if ! gh release view poi-data > /dev/null 2>&1; then
            gh release create poi-data --title "POI datasets ($DATE_STR)" --notes "$NOTES"
          fi

          mkdir -p previous
          gh release download poi-data --pattern pois-index.json --dir previous || true
          python3 scripts/poi_index.py merge --previous previous/pois-index.json \
            -o dist/pois-index.json "${entries[@]}"

          assets=(dist/*.db.gz)
          # App versions before per-country datasets download pois.db.gz.
          if [ -f dist/germany.db.gz ]; then
            cp dist/germany.db.gz dist/pois.db.gz
            assets+=(dist/pois.db.gz)
          fi
          # The files first, the index that points at them last.
          gh release upload poi-data "${assets[@]}" --clobber
          gh release upload poi-data dist/pois-index.json --clobber

          # Drop assets no dataset refers to any more (removed datasets,
          # the old checksum file).
          keep="$(python3 -c 'import json; print(" ".join(d["file"] for d in json.load(open("dist/pois-index.json"))["datasets"]))') pois.db.gz pois-index.json"
          gh release view poi-data --json assets --jq '.assets[].name' | while read -r name; do
            case " $keep " in
              *" $name "*) ;;
              *) echo "Deleting stale asset $name"; gh release delete-asset poi-data "$name" --yes ;;
            esac
          done

          gh release edit poi-data --title "POI datasets ($DATE_STR)" --notes "$NOTES"
